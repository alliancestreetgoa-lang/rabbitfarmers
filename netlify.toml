[build]
  # Three builds and one copy.
  #
  # The API's runtime dependencies are copied to the repo root because the
  # function imports the API from source: esbuild resolves imports by walking
  # up from netlify/functions, the root had no node_modules, and the first
  # real deploy failed with "Cannot find package 'hono'". The copy also gives
  # the pg external below somewhere to be packaged from. Copy, not symlink —
  # the bundler's file walker is not guaranteed to follow links.
  #
  # The web app (apps/web) is the front door and takes the root. The Expo
  # export — the same code the APK runs — moves under /app, which is why its
  # config sets experiments.baseUrl to '/app'. It is copied into the web
  # app's dist because Netlify publishes exactly one directory.
  command = """
    npm --prefix apps/api ci --omit=dev &&
    cp -R apps/api/node_modules node_modules &&
    npm --prefix apps/mobile ci &&
    npm --prefix apps/mobile run build:web &&
    npm --prefix apps/web ci &&
    npm --prefix apps/web run build &&
    cp -R apps/mobile/dist apps/web/dist/app
  """
  publish = "apps/web/dist"

  [build.environment]
    # Empty on purpose. The app then talks to /api on whatever origin it was
    # served from, so the same build works on a deploy preview, a branch deploy
    # and production without rebuilding. Set it only to point a build at an API
    # somewhere else.
    EXPO_PUBLIC_API_URL = ""

[functions]
  node_bundler = "esbuild"
  # pg ships optional native bits it does not need; leaving it external keeps
  # the bundle honest and avoids esbuild trying to resolve them.
  external_node_modules = ["pg", "pg-native"]

# ---------------------------------------------------------------- routing --
#
# The site serves two things from one origin: a single-page app exported by
# Expo, and the API/admin console inside the function. Their paths collide —
# /daily is both a screen and an endpoint — so the split has to be explicit.
#
# Redirects are evaluated top to bottom and the first match wins. The API rules
# come first, the SPA fallback last. Nothing here is `force`d, so a real static
# file (/_expo/static/js/...) is still served before any of it.
#
# The app calls /api/*. The admin console keeps its own top-level path because
# it is a plain server-rendered page a human types into the address bar.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api/admin"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api/admin/:splat"
  status = 200

[[redirects]]
  from = "/scheduler/*"
  to = "/.netlify/functions/api/scheduler/:splat"
  status = 200

# Uptime monitors and the pricing page point at these, so they stay where they
# are rather than moving under /api.
# Razorpay posts here, server to server, and the browser is redirected to
# /billing/return after a payment. Neither is a screen — if they fall through to
# the SPA rule below, Razorpay gets index.html with a 200, treats the webhook as
# delivered, and a farm that paid is never marked paid. Nothing in any log.
[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api/webhooks/:splat"
  status = 200

[[redirects]]
  from = "/billing/return"
  to = "/.netlify/functions/api/billing/return"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

# /plans was here. The product is free since migration 0031 and the endpoint is
# gone, so the path belongs to the app now like any other unrouted name.
# apps/api/test/routing.test.js is what keeps this file and scripts/dev-site.mjs
# from disagreeing about that.

# Two single-page apps now, and the order matters. The full app (the Expo
# export, same code as the APK) lives under /app: a deep link like
# /app/record/mating must return ITS shell. Everything else is the web app's —
# /dashboard, /signup, and any path neither router knows. Both are 200
# rewrites: a 301 would lose the path and a 404 would break a bookmark.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix apps/api start"
  targetPort = 3000
  port = 8888
  publish = "apps/web/dist"

# Migrations are deliberately NOT run in the build.
#
# Netlify builds can run concurrently (a deploy preview alongside production),
# and two runners applying the same migration at once is a bad afternoon. Run
# them yourself against the Neon branch before promoting a deploy:
#
#   ADMIN_DATABASE_URL='postgres://...neon.tech/...' npm --prefix apps/api run migrate
