# Build an installable Android APK on Expo's builders.
#
# Manual only — never on a push. Building costs a queue slot on the free tier,
# and an APK is something you ask for, not something that should appear because
# somebody fixed a typo.
#
# What you need first, once:
#
#   1. An Expo account. https://expo.dev
#   2. A project on it. Either `eas init` from apps/mobile on any machine, or
#      create one in the browser at expo.dev → Projects → Create. Copy its ID.
#   3. Two repository secrets, under Settings → Secrets and variables → Actions:
#        EXPO_TOKEN       expo.dev → account settings → Access tokens
#        EAS_PROJECT_ID   the project id from step 2
#
# Then: Actions → Android APK → Run workflow, and give it the address of your
# deployed site. The APK comes back as a workflow artifact you can download,
# and also stays on expo.dev with a QR code you can scan from the phone.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: >-
          Your deployed API, e.g. https://yourfarm.netlify.app/api — compiled
          into the build. Leave blank and the app asks for it on first run.
        required: false
        default: ''
      profile:
        description: 'preview = .apk you can install · production = .aab for Play'
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    name: Build ${{ inputs.profile }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # Fail here rather than four minutes in, with a sentence that says what
      # to do about it.
      #
      # Through `env:`, not interpolated into the script. A secret substituted
      # straight into a `run:` block becomes part of the command line — it
      # survives in the shell's own tracing, and a token containing a quote
      # would rewrite the test into something that passes.
      - name: Check the secrets are set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          missing=
          [ -n "$EXPO_TOKEN" ]     || missing="$missing EXPO_TOKEN"
          [ -n "$EAS_PROJECT_ID" ] || missing="$missing EAS_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "EXPO_TOKEN comes from expo.dev → account settings → Access tokens."
            echo "EAS_PROJECT_ID is the project id from \`eas init\`, or from expo.dev → Projects."
            exit 1
          fi

      # 22, matching the Node this project is developed and tested against.
      # (Unrelated to the runner's own deprecation notice about Node 20 — that
      # is the JavaScript the `actions/*` steps themselves run on, and it moves
      # when their major versions do.)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # The API address has to be written into eas.json, not just exported here.
      #
      # The build runs on Expo's machines. This runner's environment is not sent
      # to them: eas.json's `env` block is, because eas.json is uploaded with the
      # project. Setting EXPO_PUBLIC_API_URL on the `eas build` step alone looks
      # exactly like it works and produces an APK that ignores it — a silent
      # wrong answer, which is the only kind worth writing a step for.
      - name: Write the API address into eas.json
        if: inputs.api_url != ''
        env:
          API_URL: ${{ inputs.api_url }}
          PROFILE: ${{ inputs.profile }}
        run: |
          node -e '
            const fs = require("fs");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const profile = eas.build[process.env.PROFILE];
            if (!profile) throw new Error(`no build profile "${process.env.PROFILE}" in eas.json`);
            profile.env = { ...profile.env, EXPO_PUBLIC_API_URL: process.env.API_URL };
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2) + "\n");
          '
          node -e '
            const eas = JSON.parse(require("fs").readFileSync("eas.json", "utf8"));
            console.log(`${process.env.PROFILE} will build against`,
                        eas.build[process.env.PROFILE].env.EXPO_PUBLIC_API_URL);
          '

      # Bundling is where a build fails for a reason in this repository rather
      # than a reason on Expo's side — a bad import, a version mismatch, an
      # asset that is not where the config says. Catching it here costs seconds;
      # catching it on EAS costs a twenty-minute queue.
      # --clear is not belt and braces. EXPO_PUBLIC_* values are substituted
      # into the JavaScript at transform time, and Metro's transform cache is
      # not keyed on them: a rebuild with a different address reuses the old
      # one and says nothing. On a fresh runner there is no cache to reuse, but
      # this step is also the thing people copy when building by hand.
      - name: Bundle for Android first
        run: npx expo export --clear --platform android --output-dir /tmp/preflight
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Build on EAS
        id: eas
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait --json | tee build.json
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          # Overrides the empty value in eas.json. An APK with no address
          # compiled in still works — it asks on the sign-in screen — but an
          # app handed to farmers should not have to.
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Fetch the binary
        run: |
          url=$(node -e '
            const b = JSON.parse(require("fs").readFileSync("build.json", "utf8"));
            const url = b?.[0]?.artifacts?.buildUrl;
            if (!url) {
              console.error("No buildUrl in the EAS output. It said:");
              console.error(JSON.stringify(b, null, 2).slice(0, 2000));
              process.exit(1);
            }
            process.stdout.write(url);
          ')
          echo "Built: $url"
          curl -fsSL -o "rabbitry-${{ inputs.profile }}.${{ inputs.profile == 'production' && 'aab' || 'apk' }}" "$url"

      - uses: actions/upload-artifact@v4
        with:
          name: rabbitry-android-${{ inputs.profile }}
          path: apps/mobile/rabbitry-*.a*
          if-no-files-found: error
          retention-days: 30
